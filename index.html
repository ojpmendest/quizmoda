<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guía 30 prendas, 300 looks</title>
    <meta
      name="description"
      content="Guía 30/300: transforma tu clóset con 30 prendas estratégicas para 300 looks."

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link

      rel="stylesheet"
    />
    <!-- Meta Pixel Code -->
    <script>
      !(function (f, b, e, v, n, t, s) {
        if (f.fbq) return;
        n = f.fbq = function () {
          n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
        };
        if (!f._fbq) f._fbq = n;
        n.push = n;
        n.loaded = !0;
        n.version = "2.0";
        n.queue = [];
        t = b.createElement(e);
        t.async = !0;
        t.src = v;
        s = b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t, s);
      })(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");
      fbq("init", "1939378656742658");
      fbq("track", "PageView");
    </script>
    <!-- End Meta Pixel Code -->
    <!-- (noscript <img> omitido: o funil exige JS) -->

    <!-- captura fbclid -> fbc para atribuição no checkout -->
    <script>
      (function () {
        var p = new URLSearchParams(window.location.search);
        var fbclid = p.get("fbclid");
        if (fbclid) {
          try {
            localStorage.setItem("meta_fbc", "fb.1." + Math.floor(Date.now() / 1000) + "." + fbclid);
          } catch (e) {}
        }
      })();
    </script>

  </head>
